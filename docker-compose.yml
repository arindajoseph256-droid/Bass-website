version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: edushare_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: edushare
      POSTGRES_USER: edushare
      POSTGRES_PASSWORD: ${DB_PASSWORD:-edushare_secret_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edushare -d edushare"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: edushare_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: edushare_backend
    restart: unless-stopped
    environment:
      DEBUG: ${DEBUG:-False}
      DATABASE_URL: postgres://edushare:${DB_PASSWORD:-edushare_secret_password}@db:5432/edushare
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@edushare.com}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_MODEL: ${AI_MODEL:-gpt-4}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 4 --threads 2 config.wsgi:application"

  celery:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: edushare_celery
    restart: unless-stopped
    environment:
      DEBUG: ${DEBUG:-False}
      DATABASE_URL: postgres://edushare:${DB_PASSWORD:-edushare_secret_password}@db:5432/edushare
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config worker -l info

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: edushare_celery_beat
    restart: unless-stopped
    environment:
      DEBUG: ${DEBUG:-False}
      DATABASE_URL: postgres://edushare:${DB_PASSWORD:-edushare_secret_password}@db:5432/edushare
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config beat -l info

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: edushare_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/var/www/edushare:ro
      - media_data:/var/www/media:ro
      - static_data:/var/www/static:ro
      - ./deployment/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
